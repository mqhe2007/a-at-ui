<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#FFFFFF">
    <line x1="0" y1="0" x2="1200" y2="0" stroke-width="1"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke-width="1"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke-width="1"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke-width="1"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke-width="1"/>
  </g>

  <g transform="translate(106, 0)">
    <!-- A@UI -->
    <text x="310" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="800" fill="#F1F5F9">A</text>
    <text x="412" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="800" fill="#0EA5E9">@</text>
    <text x="528" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="800" fill="#F1F5F9">U</text>
    <text x="632" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="800" fill="#F1F5F9">I</text>

    <!-- Tagline -->
    <text x="600" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="6">PROTOCOL FOR AI AGENT-DRIVEN INTERFACES</text>

    <!-- Footer URL -->
    <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="300" fill="#475569" text-anchor="middle">a-at-ui.mengqinghe.com</text>
